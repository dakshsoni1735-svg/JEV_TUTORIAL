<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jev Comment Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .dashboard {
            background: #161b22;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #30363d;
            width: 100%;
            max-width: 480px;
        }

        h2 {
            margin: 0 0 8px;
            color: #f0f6fc;
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 24px;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 14px;
            box-sizing: border-box;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            resize: none;
            margin-bottom: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        button:disabled {
            background: #30363d;
            cursor: not-allowed;
        }

        .result-panel {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-title {
            font-weight: bold;
            font-size: 14px;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .theme-blocked .badge {
            color: #f85149;
            background: #3d1d1d;
        }

        .theme-approved .badge {
            color: #58a6ff;
            background: #172b44;
        }

        .meter {
            height: 8px;
            background: #0d1117;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .fill {
            height: 100%;
            width: 0;
            transition: width 0.5s;
        }

        .theme-blocked .fill {
            background: #f85149;
        }

        .theme-approved .fill {
            background: #58a6ff;
        }

        .details {
            font-size: 13px;
            color: #8b949e;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <h2>Jev Comment Classifier</h2>

    <p class="subtitle">
        Analyze comments for toxicity, spam and safe content.
    </p>

    <textarea
        id="commentBox"
        placeholder="Enter your comment here..."
    ></textarea>

    <button id="actionBtn" onclick="processMetrics()">
        Execute Security Scan
    </button>

    <div id="displayPanel" class="result-panel">

        <div class="status-header">
            <span class="status-title">Jev Predict</span>

            <span id="verdictBadge" class="badge">
                PENDING
            </span>
        </div>

        <div class="meter">
            <div id="meterFill" class="fill"></div>
        </div>

        <div id="detailsText" class="details">
            Analyzing...
        </div>

    </div>

</div>

<script>
async function processMetrics() {

    const text = document.getElementById("commentBox").value.trim();
    const button = document.getElementById("actionBtn");
    const panel = document.getElementById("displayPanel");
    const badge = document.getElementById("verdictBadge");
    const fill = document.getElementById("meterFill");
    const details = document.getElementById("detailsText");

    if (!text) {
        alert("Please enter a comment.");
        return;
    }

    button.disabled = true;
    button.innerText = "Analyzing...";
    panel.style.display = "none";

    try {

        const response = await fetch("/analyze", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                comment: text
            })
        });

        const data = await response.json();

        panel.style.display = "block";

        if (response.ok) {

            const percentage = data.probability * 100;

            if (data.action === "BLOCKED") {

                panel.className = "result-panel theme-blocked";
                badge.innerText = "Blocked";
                fill.style.width = percentage + "%";

                details.innerText =
                    "Toxicity score: " + percentage.toFixed(1) + "%";

            } else if (data.action === "FLAGGED") {

                panel.className = "result-panel theme-blocked";
                badge.innerText = "Flagged";
                fill.style.width = percentage + "%";

                details.innerText =
                    "Spam probability: " + percentage.toFixed(1) + "%";

            } else {

                panel.className = "result-panel theme-approved";
                badge.innerText = "Approved";
                fill.style.width = (100 - percentage) + "%";

                details.innerText =
                    "Comment appears safe. Confidence: " +
                    (100 - percentage).toFixed(1) + "%";
            }

        } else {

            panel.className = "result-panel";
            badge.innerText = "Error";
            fill.style.width = "0%";

            details.innerText =
                data.error || "Something went wrong.";
        }

    } catch (error) {

        panel.style.display = "block";
        panel.className = "result-panel";
        badge.innerText = "Error";
        fill.style.width = "0%";

        details.innerText =
            "Could not connect to the Flask server.";

    } finally {

        button.disabled = false;
        button.innerText = "Execute Security Scan";
    }
}
</script>

</body>
</html>
